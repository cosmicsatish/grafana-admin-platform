apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-admin-platform
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/cosmicsatish/grafana-admin-platform.git
    targetRevision: HEAD
    path: chart
    helm:
      valueFiles:
        - values/Team.yaml
        - values/GrafanaFolder.yaml
        - values/TeamLBACRule.yaml
        - values/GrafanaServiceAccount.yaml
        - values/ResourcePermission.yaml
        - values/GrafanaDashboard.yaml
        - values/GrafanaAlertRuleGroup.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: grafana-operator-configs
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
