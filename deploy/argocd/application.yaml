apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-admin-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/cosmicsatish/grafana-admin-platform.git
    targetRevision: main
    path: chart
    helm:
      valueFiles:
        - values.yaml
        - values/Team.yaml
        - values/GrafanaFolder.yaml
        - values/TeamLBACRule.yaml
        - values/GrafanaServiceAccount.yaml
        - values/ResourcePermission.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: grafana-admin
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
