    Environment: Production
    __converted_prometheus_rule__: 'true'
    severity: '{{ if ge $value 0.0 }}critical{{ else }}warning{{ end }}'
  annotations:
    description: 'Metric value is at {{ printf "%.2f" $value }} (Severity: {{ if ge
      $value 0.0 }}CRITICAL{{ else }}WARNING{{ end }}).'
    summary: ProdUatDrElasticsearchClusterYellowStatus high threshold reached on {{
      $labels.instance }}
