folderUID: alerting-rxiy1eec9ooy
name: elasticsearch_alerts_prod
interval: 1m
rules:
- uid: cf3d467e-b869-57d1-8c9c-cbc9ca8e5c69
  title: ProdUatDrHighCpuUtilization
  condition: threshold
  data:
  - refId: query
    queryType: prometheus
    relativeTimeRange:
      from: 660
      to: 60
    datasourceUid: grafanacloud-prom
    model:
      datasource:
        type: prometheus
        uid: grafanacloud-prom
      expr: max by (name, cluster, Environment, Application, host) ( elasticsearch_os_cpu_percent{
        Environment=~"PROD|UAT|DR", Application=~"STPaaS|TradeServ", cluster=~"esprd04|esprd06|esprd07|esprd08|esuat02|esuat04"
        } ) > 80.0
      instant: true
      intervalMs: 1000
      maxDataPoints: 43200
      range: false
      refId: query
  - refId: prometheus_math
    queryType: math
    relativeTimeRange:
      from: 0
      to: 0
    datasourceUid: __expr__
    model:
      datasource:
        IsPrunable: false
        access: ''
        apiVersion: ''
        basicAuth: false
        basicAuthUser: ''
        created: '0001-01-01T00:00:00Z'
        database: ''
        id: -100
        isDefault: false
        jsonData: {}
        name: __expr__
        readOnly: false
        secureJsonData: {}
        type: __expr__
        uid: __expr__
        updated: '0001-01-01T00:00:00Z'
        url: ''
        user: ''
        withCredentials: false
      expression: is_number($query) || is_nan($query) || is_inf($query)
      intervalMs: 1000
      maxDataPoints: 43200
      refId: prometheus_math
      type: math
  - refId: threshold
    queryType: threshold
    relativeTimeRange:
      from: 0
      to: 0
    datasourceUid: __expr__
    model:
      conditions:
      - evaluator:
          params:
          - 0
          type: gt
      datasource:
        IsPrunable: false
        access: ''
        apiVersion: ''
        basicAuth: false
        basicAuthUser: ''
        created: '0001-01-01T00:00:00Z'
        database: ''
        id: -100
        isDefault: false
        jsonData: {}
        name: __expr__
        readOnly: false
        secureJsonData: {}
        type: __expr__
        uid: __expr__
        updated: '0001-01-01T00:00:00Z'
        url: ''
        user: ''
        withCredentials: false
      expression: prometheus_math
      intervalMs: 1000
      maxDataPoints: 43200
      refId: threshold
      type: threshold
  for: 5m
  noDataState: OK
  execErrState: OK
  isPaused: true
  labels:
    Application: LinuxNode
    Environment: Production
    __converted_prometheus_rule__: 'true'
    severity: '{{ if ge $value 90.0 }}critical{{ else }}warning{{ end }}'
  annotations:
    description: 'Metric value is at {{ printf "%.2f" $value }} (Severity: {{ if ge
      $value 90.0 }}CRITICAL{{ else }}WARNING{{ end }}).'
    summary: ProdUatDrHighCpuUtilization high threshold reached on {{ $labels.instance
      }}
