folderUID: exported-alerts
name: integrations-windows-exporter-custom
interval: 1m
rules:
- uid: 51b61d41-7fae-5f2d-96d8-c1e968668878
  title: WindowsDiskAlmostOutOfSpace_Critical
  condition: threshold
  data:
  - refId: query
    queryType: prometheus
    relativeTimeRange:
      from: 660
      to: 60
    datasourceUid: grafanacloud-prom
    model:
      datasource:
        type: prometheus
        uid: grafanacloud-prom
      expr: 100 - ((windows_logical_disk_free_bytes) / (windows_logical_disk_size_bytes))
        * 100 > 95
      instant: true
      intervalMs: 1000
      maxDataPoints: 43200
      range: false
      refId: query
  - refId: prometheus_math
    queryType: math
    relativeTimeRange:
      from: 0
      to: 0
    datasourceUid: __expr__
    model:
      datasource:
        IsPrunable: false
        access: ''
        apiVersion: ''
        basicAuth: false
        basicAuthUser: ''
        created: '0001-01-01T00:00:00Z'
        database: ''
        id: -100
        isDefault: false
        jsonData: {}
        name: __expr__
        readOnly: false
        secureJsonData: {}
        type: __expr__
        uid: __expr__
        updated: '0001-01-01T00:00:00Z'
        url: ''
        user: ''
        withCredentials: false
      expression: is_number($query) || is_nan($query) || is_inf($query)
      intervalMs: 1000
      maxDataPoints: 43200
      refId: prometheus_math
      type: math
  - refId: threshold
    queryType: threshold
    relativeTimeRange:
      from: 0
      to: 0
    datasourceUid: __expr__
    model:
      conditions:
      - evaluator:
          params:
          - 0
          type: gt
      datasource:
        IsPrunable: false
        access: ''
        apiVersion: ''
        basicAuth: false
        basicAuthUser: ''
        created: '0001-01-01T00:00:00Z'
        database: ''
        id: -100
        isDefault: false
        jsonData: {}
        name: __expr__
        readOnly: false
        secureJsonData: {}
        type: __expr__
        uid: __expr__
        updated: '0001-01-01T00:00:00Z'
        url: ''
        user: ''
        withCredentials: false
      expression: prometheus_math
      intervalMs: 1000
      maxDataPoints: 43200
      refId: threshold
      type: threshold
  for: 15m
  noDataState: OK
  execErrState: OK
  isPaused: true
  labels:
    __converted_prometheus_rule__: 'true'
    os: windows
    severity: critical
  annotations:
    description: Disk space is more than 95% full for 15 minutes.
    summary: Windows Disk Critical >95% utilized on {{ $labels.instance }}
