{{- range .Values.datasourcePermissions }}
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaManifest
metadata:
  name: {{ .name }}
  labels:
    {{- include "grafana-admin-platform.labels" $ | nindent 4 }}
    owner: {{ .owner | default "platform" }}
spec:
  {{- include "grafana-admin-platform.instanceSelector" $ | nindent 2 }}
  template:
    apiVersion: iam.grafana.app/v0alpha1
    kind: ResourcePermission
    metadata:
      name: {{ .manifestName }}
    spec:
      target:
        kind: DataSource
        name: {{ .datasource }}
      assignments:
        {{- range .assignments }}
        {{- if .team }}
        - target:
            kind: Team
            name: {{ .team }}
          permission: {{ .permission }}
        {{- else if .serviceAccount }}
        - target:
            kind: ServiceAccount
            name: {{ .serviceAccount }}
          permission: {{ .permission }}
        {{- end }}
        {{- end }}
{{- end }}
