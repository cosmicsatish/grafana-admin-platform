{{- range .Values.lbacRules }}
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaManifest
metadata:
  name: {{ .name }}
  labels:
    {{- include "grafana-admin-platform.labels" $ | nindent 4 }}
    owner: {{ .owner | default "platform" }}
spec:
  {{- include "grafana-admin-platform.instanceSelector" $ | nindent 2 }}
  template:
    apiVersion: iam.grafana.app/v0alpha1
    kind: TeamLBACRule
    metadata:
      name: {{ .name }}-loki-lbac
    spec:
      team: {{ .team }}
      datasource: {{ .datasource | default "loki-lbac" }}
      selector: {{ .selector | quote }}
{{- end }}
