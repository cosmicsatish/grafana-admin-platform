{{- range .Values.teams }}
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaManifest
metadata:
  name: {{ .slug }}-team
  labels:
    dashboards: {{ $.Values.grafana.instanceSelectorValue | default "osttra" }}
    grafana-admin-platform: managed
    owner: {{ .owner | default "platform" }}
  {{- if .roles }}
  annotations:
    grafana.app/roles: {{ join "," .roles | quote }}
  {{- end }}
spec:
  instanceSelector:
    matchLabels:
      dashboards: {{ $.Values.grafana.instanceSelectorValue | default "osttra" }}
  template:
    apiVersion: iam.grafana.app/v0alpha1
    kind: Team
    metadata:
      name: {{ .slug }}
    spec:
      name: {{ .name | quote }}
      {{- if .email }}
      email: {{ .email | quote }}
      {{- end }}
      {{- if .syncGroups }}
      sync:
        groups:
          {{- range .syncGroups }}
          - {{ . | quote }}
          {{- end }}
      {{- end }}
{{- end }}
