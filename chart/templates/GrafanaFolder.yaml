{{- range .Values.folders }}
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaFolder
metadata:
  name: {{ .title | lower | replace " " "-" }}-folder
  labels:
    {{- include "grafana-admin-platform.labels" $ | nindent 4 }}
    owner: {{ .owner | default "platform" }}
spec:
  {{- include "grafana-admin-platform.instanceSelector" $ | nindent 2 }}
  uid: {{ .uid | quote }}
  title: {{ .title | quote }}
  {{- if .parentUid }}
  parentFolderUID: {{ .parentUid | quote }}
  {{- end }}
  {{- if .permissions }}
  permissions: |
    {
      "items": [
        {{- $length := len .permissions -}}
        {{- range $i, $perm := .permissions }}
        {{- if $perm.role }}
        { "role": {{ $perm.role | quote }}, "permission": {{ $perm.permission }} }{{ if lt (add $i 1) $length }},{{ end }}
        {{- else if $perm.team }}
        { "team": {{ $perm.team | quote }}, "permission": {{ $perm.permission }} }{{ if lt (add $i 1) $length }},{{ end }}
        {{- else if $perm.userLogin }}
        { "userLogin": {{ $perm.userLogin | quote }}, "permission": {{ $perm.permission }} }{{ if lt (add $i 1) $length }},{{ end }}
        {{- end }}
        {{- end }}
      ]
    }
  {{- end }}
{{- end }}
