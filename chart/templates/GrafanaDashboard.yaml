apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: grafana-operator-dashboard
  labels:
    dashboards: {{ .Values.grafana.instanceSelectorValue | default "osttra" }}
    {{- include "grafana-admin-platform.labels" . | nindent 4 }}
spec:
  instanceSelector:
    matchLabels:
      dashboards: {{ .Values.grafana.instanceSelectorValue | default "osttra" }}
  grafanaCom:
    id: 22785
  folderUID: "osttra"
