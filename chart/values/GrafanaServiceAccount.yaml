# ==============================================================================
# GRAFANA SERVICE ACCOUNTS VALUES
# ==============================================================================
# Service accounts have base role None and only specific fine-grained fixed roles.

serviceAccounts:
  - name: config-reconciler
    role: None
    secretName: config-reconciler-token
    fixedRoles:
      - fixed:folders.permissions:writer
      - fixed:dashboards:writer
      - fixed:serviceaccounts:writer
      - fixed:roles:writer

  - name: config-reconciler-readonly-for-testing
    role: None
    secretName: config-reconciler-readonly-token
    fixedRoles:
      - fixed:folders:reader
      - fixed:dashboards:reader
      - fixed:serviceaccounts:reader

  - name: grafana-operator
    resourceName: grafana-operator-sa
    role: None
    secretName: grafana-operator-token
    fixedRoles:
      - fixed:folders.permissions:writer
      - fixed:dashboards:writer
      - fixed:datasources.permissions:writer

  - name: grafana-resource-provisioner
    role: None
    secretName: grafana-resource-provisioner-token
    fixedRoles:
      - fixed:dashboards:reader
      - fixed:folders:reader

  - name: alert-provisioning-writer
    role: None
    secretName: alert-provisioning-writer-token
    fixedRoles:
      - fixed:alerting.provisioning:writer
      - fixed:alerting:writer

  - name: alerts-reader-ITS-30152
    resourceName: alerts-reader-its-30152
    role: None
    secretName: alerts-reader-its-30152-token
    fixedRoles:
      - fixed:alerting:reader
      - fixed:alerting.rules:reader

  - name: grafana-mcp-server
    role: None
    secretName: grafana-mcp-server-token
    fixedRoles:
      - fixed:dashboards:reader
      - fixed:folders:reader
      - fixed:datasources:explorer

  - name: MCP Grafana
    resourceName: mcp-grafana
    role: None
    secretName: mcp-grafana-token
    fixedRoles:
      - fixed:dashboards:reader
      - fixed:folders:reader

  - name: API
    resourceName: api-integration
    role: None
    secretName: api-integration-token
    fixedRoles:
      - fixed:dashboards:reader

  - name: apigee-logs-grafana-app
    role: None
    secretName: apigee-logs-token
    fixedRoles:
      - fixed:dashboards:reader
      - fixed:datasources:explorer

  - name: markitserv-datasource-viewer-app
    role: None
    secretName: markitserv-viewer-token
    fixedRoles:
      - fixed:datasources:reader
      - fixed:datasources:explorer

  - name: screenly-test-app
    role: None
    secretName: screenly-app-token
    fixedRoles:
      - fixed:dashboards:reader

  - name: svc-api-gw
    role: None
    secretName: svc-api-gw-token
    fixedRoles:
      - fixed:dashboards:reader

  - name: svc-call-grafana-api-toc
    role: None
    owner: toc
    secretName: svc-call-grafana-api-toc-token
    fixedRoles:
      - fixed:alerting:admin
      - fixed:dashboards:writer

  - name: toc-tools
    role: None
    owner: toc
    secretName: toc-tools-token
    fixedRoles:
      - fixed:dashboards:reader
      - fixed:alerting:reader

  - name: winops-automation
    role: None
    secretName: winops-automation-token
    fixedRoles:
      - fixed:dashboards:reader
      - fixed:datasources:explorer

  - name: log-downloader
    role: None
    secretName: log-downloader-token
    fixedRoles:
      - fixed:dashboards:reader
      - fixed:datasources:explorer

  - name: Rama_personal_account
    resourceName: rama-personal-account
    role: None
    owner: rama
    secretName: rama-personal-account-token

  - name: Satish-Personal-Token
    resourceName: satish-personal-token
    role: None
    owner: satish
    secretName: satish-personal-token-secret
