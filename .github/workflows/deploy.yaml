name: Deploy Grafana Admin Platform

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Bootstrap & Deploy Cluster
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Setup Kind Cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: grafana-admin-gitops

      - name: Deploy Operator & Declarative Platform
        env:
          GRAFANA_URL: ${{ secrets.GRAFANA_URL }}
          GRAFANA_TOKEN: ${{ secrets.GRAFANA_TOKEN }}
        run: |
          set -euo pipefail
          ./deploy/install.sh

      - name: Verify Reconciliation & Display Status
        run: |
          echo "Waiting for Grafana Operator reconciliation..."
          kubectl wait --for=condition=GrafanaReady grafana/grafana -n grafana-admin --timeout=180s || true
          echo "=== Managed Resources Status ==="
          kubectl get grafanas,grafanafolders,grafanaserviceaccounts,grafanadatasources,grafanadashboards,grafanamanifests -n grafana-admin -o wide
