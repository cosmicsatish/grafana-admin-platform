name: Deploy Grafana Admin Platform

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Bootstrap & Deploy Cluster
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Kubectl
        uses: azure/setup-kubectl@v5

      - name: Setup Helm
        uses: azure/setup-helm@v5

      - name: Setup Kind Cluster
        uses: helm/kind-action@v1.14.0
        with:
          cluster_name: grafana-admin-gitops

      - name: Pre-configure CI Secrets if not present
        env:
          GRAFANA_URL: ${{ secrets.GRAFANA_URL }}
          GRAFANA_TOKEN: ${{ secrets.GRAFANA_TOKEN }}
        run: |
          kubectl create namespace grafana-admin --dry-run=client -o yaml | kubectl apply -f -
          if [[ -n "${GRAFANA_TOKEN:-}" ]]; then
            kubectl create secret generic grafana-admin-token -n grafana-admin \
              --from-literal=token="${GRAFANA_TOKEN}" \
              --dry-run=client -o yaml | kubectl apply -f -
          else
            echo "::notice ::GRAFANA_TOKEN secret not set; creating placeholder secret for CI deployment validation."
            kubectl create secret generic grafana-admin-token -n grafana-admin \
              --from-literal=token="ci-validation-token-placeholder" \
              --dry-run=client -o yaml | kubectl apply -f -
          fi

      - name: Deploy Operator & Declarative Platform
        run: |
          set -euo pipefail
          ./deploy/install.sh

      - name: Verify Reconciliation & Display Status
        run: |
          echo "Waiting for Grafana Operator reconciliation..."
          kubectl wait --for=condition=GrafanaReady grafana/grafana -n grafana-admin --timeout=30s || true
          echo "=== Managed Resources Status ==="
          kubectl get grafanas,grafanafolders,grafanaserviceaccounts,grafanadatasources,grafanadashboards,grafanamanifests -n grafana-admin -o wide || true
