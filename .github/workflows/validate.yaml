name: Validate Grafana Admin Platform

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Lint, Policy & Template Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate YAML Syntax
        run: |
          python - <<'PY'
          import pathlib, sys, yaml
          failures = []
          for p in pathlib.Path('.').rglob('*.yaml'):
              if '.git' in p.parts or 'templates' in p.parts:
                  continue
              try:
                  list(yaml.safe_load_all(p.read_text()))
              except Exception as e:
                  failures.append((str(p), str(e)))
          if failures:
              for p, e in failures:
                  print(f'{p}: {e}', file=sys.stderr)
              raise SystemExit(1)
          print('YAML syntax OK')
          PY

      - name: Credential Scanner (Reject Plaintext Secrets)
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE '(password:|token:|client_secret:|private_key:)' --include='*.yaml' . --exclude-dir=.github --exclude='*.md' | grep -vE '(secretName:|secretKeyRef:|key: token$|tokens:|password.*Secret|token.*Secret|README)'; then
            echo 'Potential credential literal found.' >&2
            exit 1
          fi

      - name: Install Conftest
        run: |
          curl -sL https://github.com/open-policy-agent/conftest/releases/download/v0.56.0/conftest_0.56.0_Linux_x86_64.tar.gz | sudo tar xz -C /usr/local/bin conftest

      - name: Run Conftest Policy Guardrails
        run: conftest test chart/values/*.yaml -p policy/

      - name: Setup Helm
        uses: azure/setup-helm@v5

      - name: Lint and Template Chart
        run: |
          helm lint chart/ -f chart/values/Team.yaml -f chart/values/GrafanaFolder.yaml -f chart/values/TeamLBACRule.yaml -f chart/values/GrafanaServiceAccount.yaml -f chart/values/ResourcePermission.yaml
          helm template grafana-admin chart/ -f chart/values/Team.yaml -f chart/values/GrafanaFolder.yaml -f chart/values/TeamLBACRule.yaml -f chart/values/GrafanaServiceAccount.yaml -f chart/values/ResourcePermission.yaml > /tmp/rendered.yaml
          test -s /tmp/rendered.yaml

  cluster-validation:
    name: Kubernetes Server-Side Dry-Run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Tools
        uses: azure/setup-kubectl@v5

      - name: Setup Helm
        uses: azure/setup-helm@v5

      - name: Setup Kind Cluster
        uses: helm/kind-action@v1.14.0

      - name: Install Grafana Operator CRDs
        run: |
          kubectl create namespace grafana-operator --dry-run=client -o yaml | kubectl apply -f -
          helm upgrade --install grafana-operator \
            oci://ghcr.io/grafana/helm-charts/grafana-operator \
            --version 5.24.0 \
            --namespace grafana-operator \
            --values deploy/operator-values.yaml
          kubectl wait --for=condition=Established crd/grafanas.grafana.integreatly.org --timeout=120s

      - name: Server-Side Dry-Run Manifests
        run: |
          kubectl create namespace grafana-admin --dry-run=client -o yaml | kubectl apply -f -
          helm template grafana-admin chart/ -f chart/values/Team.yaml -f chart/values/GrafanaFolder.yaml -f chart/values/TeamLBACRule.yaml -f chart/values/GrafanaServiceAccount.yaml -f chart/values/ResourcePermission.yaml | kubectl apply --dry-run=server -n grafana-admin -f -
