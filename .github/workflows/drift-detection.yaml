name: Nightly Drift & Integrity Detection

on:
  schedule:
    # Run nightly at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Validate Chart Rendering & Integrity
        id: helm_check
        run: |
          helm lint chart/ -f chart/values/Team.yaml -f chart/values/GrafanaFolder.yaml -f chart/values/TeamLBACRule.yaml -f chart/values/GrafanaServiceAccount.yaml -f chart/values/ResourcePermission.yaml
          helm template grafana-admin chart/ -f chart/values/Team.yaml -f chart/values/GrafanaFolder.yaml -f chart/values/TeamLBACRule.yaml -f chart/values/GrafanaServiceAccount.yaml -f chart/values/ResourcePermission.yaml > /tmp/rendered.yaml
          test -s /tmp/rendered.yaml

      - name: Policy Guardrails Check
        id: policy_check
        uses: open-policy-agent/conftest-action@v1.5.0
        with:
          files: chart/values/*.yaml
          policy: policy/

      - name: Notify on Drift or Policy Violation
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const message = [
              `Nightly validation failed on branch **${context.ref}** at commit ${context.sha}.`,
              '',
              `Please inspect the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.`
            ].join('\n');

            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Nightly Drift / Policy Integrity Failure Detected',
              body: message
            });
