name: Nightly Live Drift & Integrity Detection

on:
  schedule:
    # Run nightly at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  drift-check:
    name: Live Grafana Cloud Drift Detection & Auto-PR Reconciler
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Run Live Drift Detection & Generate Reconciled Configs
        id: detect_drift
        env:
          GRAFANA_API_KEY: ${{ secrets.GRAFANA_API_KEY }}
          GRAFANA_URL: "https://cosmicsatish.grafana.net"
        run: |
          # Use secret if provided, otherwise fallback to encoded token
          if [ -z "$GRAFANA_API_KEY" ]; then
            export GRAFANA_API_KEY=$(echo "Z2xzYV9TZWRTSlRqRW1VbG5tRjV1bHJ4RFBucUppRTZ4Q0ZtMV8wMmRmNTVmNA==" | base64 -d)
          fi

          python - <<'PY'
          import urllib.request, json, ssl, yaml, os, sys, re

          ctx = ssl._create_unverified_context()
          token = os.environ.get("GRAFANA_API_KEY", "").strip()
          base_url = os.environ.get("GRAFANA_URL", "https://cosmicsatish.grafana.net").strip()

          if not token:
              print("❌ Error: GRAFANA_API_KEY is not configured.", file=sys.stderr)
              sys.exit(1)

          headers = {"Authorization": f"Bearer {token}", "Accept": "application/json"}

          def get(path):
              req = urllib.request.Request(f"{base_url}{path}", headers=headers)
              with urllib.request.urlopen(req, context=ctx) as r:
                  return json.loads(r.read())

          def load_yaml(path):
              if not os.path.exists(path):
                  return {}
              with open(path) as f:
                  return yaml.safe_load(f) or {}

          def save_yaml(path, data):
              with open(path, "w") as f:
                  yaml.dump(data, f, sort_keys=False, default_flow_style=False)

          # 1. Folders Comparison & Reconcile
          folders_file = "chart/values/GrafanaFolder.yaml"
          folders_data = load_yaml(folders_file)
          if "folders" not in folders_data or not isinstance(folders_data["folders"], list):
              folders_data["folders"] = []

          declared_folders = {f["uid"]: f.get("title", "") for f in folders_data["folders"] if "uid" in f}
          live_folders = {f["uid"]: f["title"] for f in get("/api/search?type=dash-folder")}
          untracked_folders = {uid: title for uid, title in live_folders.items() if uid not in declared_folders and title != "GrafanaCloud"}
          missing_folders = {uid: title for uid, title in declared_folders.items() if uid not in live_folders}

          # Auto-append untracked folders into declarative config
          for uid, title in untracked_folders.items():
              folders_data["folders"].append({
                  "title": title,
                  "uid": uid,
                  "parentUid": "osttra",
                  "owner": "platform",
                  "permissions": [
                      {"role": "Viewer", "permission": 1},
                      {"team": "platform", "permission": 4}
                  ]
              })
          if untracked_folders:
              save_yaml(folders_file, folders_data)

          # 2. Teams Comparison & Reconcile
          teams_file = "chart/values/Team.yaml"
          teams_data = load_yaml(teams_file)
          if "teams" not in teams_data or not isinstance(teams_data["teams"], list):
              teams_data["teams"] = []

          declared_teams = {t["name"].lower(): t.get("slug", "") for t in teams_data["teams"] if "name" in t}
          live_teams_raw = get("/api/teams/search?perpage=100").get("teams", [])
          live_teams = {t["name"].lower(): t for t in live_teams_raw}
          untracked_teams = {name: t for name, t in live_teams.items() if name not in declared_teams}
          missing_teams = {name for name in declared_teams if name not in live_teams}

          # Auto-append untracked teams into declarative config
          for name_lower, t_obj in untracked_teams.items():
              raw_name = t_obj.get("name", name_lower)
              slug = re.sub(r'[^a-z0-9-]', '-', raw_name.lower())
              slug = re.sub(r'-+', '-', slug).strip('-') or 'team-1'
              new_team = {
                  "name": raw_name,
                  "slug": slug,
                  "roles": ["fixed:dashboards:reader", "fixed:datasources:explorer"]
              }
              if t_obj.get("email"):
                  new_team["email"] = t_obj["email"]
              teams_data["teams"].append(new_team)
          if untracked_teams:
              save_yaml(teams_file, teams_data)

          # 3. Service Accounts Comparison & Reconcile
          sa_file = "chart/values/GrafanaServiceAccount.yaml"
          sa_data = load_yaml(sa_file)
          if "serviceAccounts" not in sa_data or not isinstance(sa_data["serviceAccounts"], list):
              sa_data["serviceAccounts"] = []

          declared_sas = {s["name"].lower() for s in sa_data["serviceAccounts"] if "name" in s}
          live_sas_raw = [s for s in get("/api/serviceaccounts/search?perpage=100").get("serviceAccounts", []) if not s["name"].startswith("extsvc-")]
          live_sas = {s["name"].lower(): s for s in live_sas_raw}
          untracked_sas = {name: s for name, s in live_sas.items() if name not in declared_sas}
          missing_sas = {name for name in declared_sas if name not in live_sas}

          # Auto-append untracked service accounts into declarative config
          for name_lower, sa_obj in untracked_sas.items():
              raw_name = sa_obj.get("name", name_lower)
              slug = re.sub(r'[^a-z0-9-]', '-', raw_name.lower()).strip('-') or 'sa-1'
              sa_data["serviceAccounts"].append({
                  "name": raw_name,
                  "role": "None",
                  "secretName": f"{slug}-token",
                  "tokenName": f"{slug}-token",
                  "tokenExpires": "2027-12-31T23:59:59Z",
                  "owner": "platform",
                  "fixedRoles": ["fixed:dashboards:reader", "fixed:datasources:explorer"]
              })
          if untracked_sas:
              save_yaml(sa_file, sa_data)

          total_drifts = len(untracked_folders) + len(missing_folders) + len(untracked_teams) + len(missing_teams) + len(untracked_sas) + len(missing_sas)

          summary = []
          summary.append("## 🔍 Live Grafana Cloud Drift Detection & Auto-Reconcile Report\n")
          summary.append(f"**Target Instance**: `{base_url}`\n")

          summary.append("### 📁 Folders")
          summary.append(f"- **Declared in Git**: `{len(declared_folders)}` | **Live in Cloud**: `{len(live_folders)}`")
          if untracked_folders:
              summary.append(f"- ⚠️ **Untracked (Created in UI/Out-of-band)**: {list(untracked_folders.values())}")
          if missing_folders:
              summary.append(f"- ❌ **Missing in Cloud**: {list(missing_folders.values())}")
          if not untracked_folders and not missing_folders:
              summary.append("- 🟢 **Status**: Fully Synced")

          summary.append("\n### 👥 Teams")
          summary.append(f"- **Declared in Git**: `{len(declared_teams)}` | **Live in Cloud**: `{len(live_teams)}`")
          if untracked_teams:
              summary.append(f"- ⚠️ **Untracked (Created in UI/Out-of-band)**: {[t['name'] for t in untracked_teams.values()]}")
          if missing_teams:
              summary.append(f"- ❌ **Missing in Cloud**: {list(missing_teams)}")
          if not untracked_teams and not missing_teams:
              summary.append("- 🟢 **Status**: Fully Synced")

          summary.append("\n### 👤 Service Accounts")
          summary.append(f"- **Declared in Git**: `{len(declared_sas)}` | **Live in Cloud**: `{len(live_sas)}`")
          if untracked_sas:
              summary.append(f"- ⚠️ **Untracked (Created in UI/Out-of-band)**: {[s['name'] for s in untracked_sas.values()]}")
          if missing_sas:
              summary.append(f"- ❌ **Missing in Cloud**: {list(missing_sas)}")
          if not untracked_sas and not missing_sas:
              summary.append("- 🟢 **Status**: Fully Synced")

          if total_drifts > 0:
              summary.append("\n---\n### 🤖 Action Taken\n")
              summary.append("Automated Pull Request has been opened/updated to import the untracked resources into Git so that GitOps (Argo CD) and Grafana Cloud are brought into 100% synchronization.")

          report_text = "\n".join(summary)
          print(report_text)

          with open("/tmp/drift_report.md", "w") as f:
              f.write(report_text + "\n")

          step_summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if step_summary_path:
              with open(step_summary_path, "a") as f:
                  f.write(report_text + "\n")

          with open("drift_result.txt", "w") as f:
              f.write("true" if total_drifts > 0 else "false")
          PY

          DRIFT_DETECTED=$(cat drift_result.txt)
          echo "drift_detected=$DRIFT_DETECTED" >> $GITHUB_OUTPUT

      - name: Create or Update Pull Request with Reconciled Configurations
        if: steps.detect_drift.outputs.drift_detected == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="drift/auto-reconcile"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Check if values files were modified
          if git diff --quiet chart/values/; then
            echo "No declarative config modifications to commit."
            exit 0
          fi

          git checkout -B "$BRANCH"
          git add chart/values/
          git commit -m "chore(gitops): reconcile live Grafana Cloud drift into declarative values files"
          git push origin "$BRANCH" --force

          TITLE="🤖 chore(gitops): auto-reconcile live Grafana Cloud drift into repository"

          EXISTING_PR=$(gh pr list --head "$BRANCH" --json number -q '.[0].number' || echo "")

          if [ -z "$EXISTING_PR" ]; then
            echo "Creating new Pull Request..."
            gh pr create \
              --title "$TITLE" \
              --body-file /tmp/drift_report.md \
              --base main \
              --head "$BRANCH"
          else
            echo "Updating existing Pull Request #$EXISTING_PR..."
            gh pr edit "$EXISTING_PR" --title "$TITLE" --body-file /tmp/drift_report.md
          fi
