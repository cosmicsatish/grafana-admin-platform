name: Automated Resource Onboarding

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'add_or_update'
        type: choice
        options:
          - add_or_update
          - remove
      confirm_delete:
        description: 'Safety Confirmation (Must type "DELETE" if action is remove)'
        required: false
        default: ''
        type: string
      resource_type:
        description: 'Resource Type'
        required: true
        default: 'team'
        type: choice
        options:
          - team
          - folder
          - service_account
          - lbac_rule
      name:
        description: 'Name / Title (e.g. Payments Team, Payments Folder, payments-sa)'
        required: true
        type: string
      slug:
        description: 'Identifier / Slug / UID (e.g. payments, folder-payments) - auto-derived if blank'
        required: false
        default: ''
        type: string
      owner:
        description: 'Owner Team (e.g. platform, payments)'
        required: false
        type: string
      roles:
        description: 'Fixed Roles (comma-separated, e.g. fixed:dashboards:reader, fixed:datasources:explorer)'
        required: false
        type: string
      sync_groups:
        description: 'Azure AD Group GUIDs (comma-separated, for teams)'
        required: false
        type: string
      selector:
        description: 'LogQL Selector (for Loki LBAC rules, e.g. { app="payments" })'
        required: false
        type: string

permissions:
  contents: write

jobs:
  onboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo curl -sL https://github.com/mikefarah/yq/releases/download/v4.45.4/yq_linux_amd64 -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Mutate Values Files
        env:
          ACTION: ${{ github.event.inputs.action }}
          CONFIRM_DELETE: ${{ github.event.inputs.confirm_delete }}
          TYPE: ${{ github.event.inputs.resource_type }}
          NAME: ${{ github.event.inputs.name }}
          SLUG_INPUT: ${{ github.event.inputs.slug }}
          OWNER: ${{ github.event.inputs.owner }}
          ROLES: ${{ github.event.inputs.roles }}
          SYNC_GROUPS: ${{ github.event.inputs.sync_groups }}
          SELECTOR: ${{ github.event.inputs.selector }}
        run: |
          set -euo pipefail

          # Normalize slug to RFC 1123 format (lowercase alphanumeric and hyphens only)
          if [ -n "$SLUG_INPUT" ]; then
            SLUG=$(echo "$SLUG_INPUT" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | sed 's/--*/-/g' | sed 's/^-//;s/-$//')
          else
            SLUG=$(echo "$NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | sed 's/--*/-/g' | sed 's/^-//;s/-$//')
          fi

          if [ -z "$SLUG" ]; then
            SLUG="resource-1"
          fi

          export SLUG
          export OWNER_TEAM="${OWNER:-platform}"
          export TEAM_TARGET="${OWNER:-$SLUG}"

          # ==========================================
          # REMOVE ACTION
          # ==========================================
          if [ "$ACTION" = "remove" ]; then
            if [ "$CONFIRM_DELETE" != "DELETE" ]; then
              echo "❌ Safety Check Failed: You must type 'DELETE' in confirm_delete to remove resources." >&2
              exit 1
            fi

            echo "🗑️ Removing $TYPE: '$NAME' (slug: $SLUG)"

            if [ "$TYPE" = "team" ]; then
              yq -i 'del(.teams[] | select(.slug == strenv(SLUG) or .name == strenv(NAME)))' chart/values/Team.yaml
              yq -i 'del(.datasourcePermissions[0].assignments[] | select(.team == strenv(SLUG)))' chart/values/ResourcePermission.yaml
              yq -i 'del(.lbacRules[] | select(.name == strenv(SLUG) or .team == strenv(SLUG)))' chart/values/TeamLBACRule.yaml

            elif [ "$TYPE" = "folder" ]; then
              yq -i 'del(.folders[] | select(.uid == strenv(SLUG) or .title == strenv(NAME)))' chart/values/GrafanaFolder.yaml

            elif [ "$TYPE" = "service_account" ]; then
              yq -i 'del(.serviceAccounts[] | select(.name == strenv(NAME)))' chart/values/GrafanaServiceAccount.yaml

            elif [ "$TYPE" = "lbac_rule" ]; then
              yq -i 'del(.lbacRules[] | select(.name == strenv(SLUG) or .team == strenv(SLUG)))' chart/values/TeamLBACRule.yaml
              yq -i 'del(.datasourcePermissions[0].assignments[] | select(.team == strenv(SLUG)))' chart/values/ResourcePermission.yaml
            fi

            echo "✅ Successfully removed $TYPE '$NAME' from values files"
            exit 0
          fi

          # ==========================================
          # ADD OR UPDATE ACTION
          # ==========================================
          echo "📝 Processing add/update for $TYPE: '$NAME' (slug: $SLUG)"

          if [ "$TYPE" = "team" ]; then
            yq -i 'del(.teams[] | select(.slug == strenv(SLUG) or .name == strenv(NAME)))' chart/values/Team.yaml
            yq -i '.teams += [{"name": strenv(NAME), "slug": strenv(SLUG)}]' chart/values/Team.yaml

            if [ -n "$OWNER" ]; then
              yq -i '(.teams[] | select(.slug == strenv(SLUG))).owner = strenv(OWNER)' chart/values/Team.yaml
            fi
            if [ -n "$ROLES" ]; then
              yq -i '(.teams[] | select(.slug == strenv(SLUG))).roles = (strenv(ROLES) | split(",") | map(sub("^[ ]+", "") | sub("[ ]+$", "")))' chart/values/Team.yaml
            fi
            if [ -n "$SYNC_GROUPS" ]; then
              yq -i '(.teams[] | select(.slug == strenv(SLUG))).syncGroups = (strenv(SYNC_GROUPS) | split(",") | map(sub("^[ ]+", "") | sub("[ ]+$", "")))' chart/values/Team.yaml
            fi

            if [ -n "$SELECTOR" ]; then
              yq -i 'del(.lbacRules[] | select(.name == strenv(SLUG)))' chart/values/TeamLBACRule.yaml
              yq -i '.lbacRules += [{
                "name": strenv(SLUG),
                "team": strenv(SLUG),
                "datasource": "grafanacloud-cosmicsatish-logs-lbac",
                "selector": strenv(SELECTOR)
              }]' chart/values/TeamLBACRule.yaml

              yq -i 'del(.datasourcePermissions[0].assignments[] | select(.team == strenv(SLUG)))' chart/values/ResourcePermission.yaml
              yq -i '.datasourcePermissions[0].assignments += [{
                "team": strenv(SLUG),
                "permission": "Query"
              }]' chart/values/ResourcePermission.yaml
            fi

          elif [ "$TYPE" = "folder" ]; then
            yq -i 'del(.folders[] | select(.uid == strenv(SLUG) or .title == strenv(NAME)))' chart/values/GrafanaFolder.yaml
            yq -i '.folders += [{
              "title": strenv(NAME),
              "uid": strenv(SLUG),
              "parentUid": "osttra",
              "owner": strenv(OWNER_TEAM),
              "permissions": [
                {"role": "Viewer", "permission": 1},
                {"team": strenv(OWNER_TEAM), "permission": 4}
              ]
            }]' chart/values/GrafanaFolder.yaml

          elif [ "$TYPE" = "service_account" ]; then
            yq -i 'del(.serviceAccounts[] | select(.name == strenv(NAME)))' chart/values/GrafanaServiceAccount.yaml
            yq -i '.serviceAccounts += [{
              "name": strenv(NAME),
              "role": "None",
              "secretName": (strenv(SLUG) + "-token"),
              "tokenName": (strenv(SLUG) + "-token"),
              "tokenExpires": "2027-12-31T23:59:59Z"
            }]' chart/values/GrafanaServiceAccount.yaml

            if [ -n "$OWNER" ]; then
              yq -i '(.serviceAccounts[] | select(.name == strenv(NAME))).owner = strenv(OWNER)' chart/values/GrafanaServiceAccount.yaml
            fi
            if [ -n "$ROLES" ]; then
              yq -i '(.serviceAccounts[] | select(.name == strenv(NAME))).fixedRoles = (strenv(ROLES) | split(",") | map(sub("^[ ]+", "") | sub("[ ]+$", "")))' chart/values/GrafanaServiceAccount.yaml
            fi

          elif [ "$TYPE" = "lbac_rule" ]; then
            yq -i 'del(.lbacRules[] | select(.name == strenv(SLUG)))' chart/values/TeamLBACRule.yaml
            yq -i '.lbacRules += [{
              "name": strenv(SLUG),
              "team": strenv(TEAM_TARGET),
              "datasource": "grafanacloud-cosmicsatish-logs-lbac",
              "selector": strenv(SELECTOR)
            }]' chart/values/TeamLBACRule.yaml

            yq -i 'del(.datasourcePermissions[0].assignments[] | select(.team == strenv(TEAM_TARGET)))' chart/values/ResourcePermission.yaml
            yq -i '.datasourcePermissions[0].assignments += [{
              "team": strenv(TEAM_TARGET),
              "permission": "Query"
            }]' chart/values/ResourcePermission.yaml
          fi

          echo "✅ Successfully updated values files for $TYPE '$NAME'"

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Validate Syntax & Linting
        run: |
          helm lint chart/ -f chart/values/Team.yaml -f chart/values/GrafanaFolder.yaml -f chart/values/TeamLBACRule.yaml -f chart/values/GrafanaServiceAccount.yaml -f chart/values/ResourcePermission.yaml -f chart/values/GrafanaDatasource.yaml
          helm template grafana-admin chart/ -f chart/values/Team.yaml -f chart/values/GrafanaFolder.yaml -f chart/values/TeamLBACRule.yaml -f chart/values/GrafanaServiceAccount.yaml -f chart/values/ResourcePermission.yaml -f chart/values/GrafanaDatasource.yaml > /dev/null

      - name: Install Conftest
        run: |
          curl -sL https://github.com/open-policy-agent/conftest/releases/download/v0.59.0/conftest_0.59.0_Linux_x86_64.tar.gz | sudo tar xz -C /usr/local/bin conftest

      - name: Run Conftest Policy Guardrails
        run: conftest test chart/values/*.yaml -p policy/

      - name: Commit & Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add chart/values/
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(gitops): ${{ github.event.inputs.action }} ${{ github.event.inputs.resource_type }} '${{ github.event.inputs.name }}'"
          git push origin main
