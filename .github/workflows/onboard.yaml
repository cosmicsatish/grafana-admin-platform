name: Automated Resource Onboarding

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'add_or_update'
        type: choice
        options:
          - add_or_update
          - remove
      resource_type:
        description: 'Resource Type'
        required: true
        default: 'team'
        type: choice
        options:
          - team
          - folder
          - service_account
          - lbac_rule
      name:
        description: 'Name / Title (e.g. Payments, DBS Analytics, folder name, SA name)'
        required: true
        type: string
      slug:
        description: 'Identifier / Slug / UID (e.g. payments, folder-payments)'
        required: true
        type: string
      owner:
        description: 'Owner Team (for folders, service accounts, or LBAC rules)'
        required: false
        type: string
      roles:
        description: 'Fixed Roles (comma-separated, e.g. fixed:dashboards:reader,fixed:datasources:explorer)'
        required: false
        type: string
      sync_groups:
        description: 'Azure AD Group GUIDs (comma-separated, for teams)'
        required: false
        type: string
      selector:
        description: 'LogQL Selector (for Loki LBAC rules, e.g. { app="payments" })'
        required: false
        type: string

permissions:
  contents: write

jobs:
  onboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Process Resource Mutation using native yq
        env:
          ACTION: ${{ github.event.inputs.action }}
          TYPE: ${{ github.event.inputs.resource_type }}
          NAME: ${{ github.event.inputs.name }}
          SLUG: ${{ github.event.inputs.slug }}
          OWNER: ${{ github.event.inputs.owner }}
          ROLES: ${{ github.event.inputs.roles }}
          SYNC_GROUPS: ${{ github.event.inputs.sync_groups }}
          SELECTOR: ${{ github.event.inputs.selector }}
        run: |
          set -euo pipefail

          if [[ "$ACTION" == "remove" ]]; then
            echo "🗑️ Removing $TYPE with slug/name: $SLUG / $NAME"
            if [[ "$TYPE" == "team" ]]; then
              yq -i 'del(.teams[] | select(.slug == env(SLUG) or .name == env(NAME)))' chart/values/Team.yaml
              yq -i 'del(.datasourcePermissions[0].assignments[] | select(.team == env(SLUG)))' chart/values/ResourcePermission.yaml
            elif [[ "$TYPE" == "folder" ]]; then
              yq -i 'del(.folders[] | select(.uid == env(SLUG) or .title == env(NAME)))' chart/values/GrafanaFolder.yaml
            elif [[ "$TYPE" == "service_account" ]]; then
              yq -i 'del(.serviceAccounts[] | select(.name == env(NAME)))' chart/values/GrafanaServiceAccount.yaml
            elif [[ "$TYPE" == "lbac_rule" ]]; then
              yq -i 'del(.lbacRules[] | select(.name == env(SLUG) or .team == env(SLUG)))' chart/values/TeamLBACRule.yaml
              yq -i 'del(.datasourcePermissions[0].assignments[] | select(.team == env(SLUG)))' chart/values/ResourcePermission.yaml
            fi
            exit 0
          fi

          # Action: add_or_update
          if [[ "$TYPE" == "team" ]]; then
            # Delete old entry if exists to ensure clean update
            yq -i 'del(.teams[] | select(.slug == env(SLUG)))' chart/values/Team.yaml

            cat <<EOF | yq -i '.teams += [load("/dev/stdin")]' chart/values/Team.yaml
            name: $NAME
            slug: $SLUG
            EOF

            if [[ -n "$ROLES" ]]; then
              yq -i '(.teams[] | select(.slug == env(SLUG))).roles = (env(ROLES) | split(","))' chart/values/Team.yaml
            fi
            if [[ -n "$SYNC_GROUPS" ]]; then
              yq -i '(.teams[] | select(.slug == env(SLUG))).syncGroups = (env(SYNC_GROUPS) | split(","))' chart/values/Team.yaml
            fi

            if [[ -n "$SELECTOR" ]]; then
              yq -i 'del(.lbacRules[] | select(.name == env(SLUG)))' chart/values/TeamLBACRule.yaml
              cat <<EOF | yq -i '.lbacRules += [load("/dev/stdin")]' chart/values/TeamLBACRule.yaml
              name: $SLUG
              team: $SLUG
              datasource: loki-lbac
              selector: '$SELECTOR'
              EOF

              yq -i 'del(.datasourcePermissions[0].assignments[] | select(.team == env(SLUG)))' chart/values/ResourcePermission.yaml
              cat <<EOF | yq -i '.datasourcePermissions[0].assignments += [load("/dev/stdin")]' chart/values/ResourcePermission.yaml
              team: $SLUG
              permission: Query
              EOF
            fi

          elif [[ "$TYPE" == "folder" ]]; then
            OWNER_TEAM="${OWNER:-platform}"
            yq -i 'del(.folders[] | select(.uid == env(SLUG)))' chart/values/GrafanaFolder.yaml
            cat <<EOF | yq -i '.folders += [load("/dev/stdin")]' chart/values/GrafanaFolder.yaml
            title: $NAME
            uid: $SLUG
            parentUid: osttra
            owner: $OWNER_TEAM
            permissions:
              - role: Viewer
                permission: 1
              - team: $OWNER_TEAM
                permission: 4
            EOF

          elif [[ "$TYPE" == "service_account" ]]; then
            yq -i 'del(.serviceAccounts[] | select(.name == env(NAME)))' chart/values/GrafanaServiceAccount.yaml
            cat <<EOF | yq -i '.serviceAccounts += [load("/dev/stdin")]' chart/values/GrafanaServiceAccount.yaml
            name: $NAME
            role: None
            secretName: ${SLUG}-token
            EOF

            if [[ -n "$OWNER" ]]; then
              yq -i '(.serviceAccounts[] | select(.name == env(NAME))).owner = env(OWNER)' chart/values/GrafanaServiceAccount.yaml
            fi
            if [[ -n "$ROLES" ]]; then
              yq -i '(.serviceAccounts[] | select(.name == env(NAME))).fixedRoles = (env(ROLES) | split(","))' chart/values/GrafanaServiceAccount.yaml
            fi

          elif [[ "$TYPE" == "lbac_rule" ]]; then
            export TEAM_TARGET="${OWNER:-$SLUG}"
            yq -i 'del(.lbacRules[] | select(.name == env(SLUG)))' chart/values/TeamLBACRule.yaml
            cat <<EOF | yq -i '.lbacRules += [load("/dev/stdin")]' chart/values/TeamLBACRule.yaml
            name: $SLUG
            team: $TEAM_TARGET
            datasource: loki-lbac
            selector: '$SELECTOR'
            EOF

            yq -i 'del(.datasourcePermissions[0].assignments[] | select(.team == env(TEAM_TARGET)))' chart/values/ResourcePermission.yaml
            cat <<EOF | yq -i '.datasourcePermissions[0].assignments += [load("/dev/stdin")]' chart/values/ResourcePermission.yaml
            team: $TEAM_TARGET
            permission: Query
            EOF
          fi

      - name: Setup Helm
        uses: azure/setup-helm@v5

      - name: Validate Syntax & Linting
        run: |
          helm lint chart/ -f chart/values/Team.yaml -f chart/values/GrafanaFolder.yaml -f chart/values/TeamLBACRule.yaml -f chart/values/GrafanaServiceAccount.yaml -f chart/values/ResourcePermission.yaml
          helm template grafana-admin chart/ -f chart/values/Team.yaml -f chart/values/GrafanaFolder.yaml -f chart/values/TeamLBACRule.yaml -f chart/values/GrafanaServiceAccount.yaml -f chart/values/ResourcePermission.yaml > /dev/null

      - name: Install Conftest
        run: |
          curl -sL https://github.com/open-policy-agent/conftest/releases/download/v0.56.0/conftest_0.56.0_Linux_x86_64.tar.gz | sudo tar xz -C /usr/local/bin conftest

      - name: Run Conftest Policy Guardrails
        run: conftest test chart/values/*.yaml -p policy/

      - name: Commit & Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add chart/values/
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(gitops): ${{ github.event.inputs.action }} ${{ github.event.inputs.resource_type }} '${{ github.event.inputs.name }}'"
          git push origin main
