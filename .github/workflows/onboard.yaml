name: Automated Resource Onboarding

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'add_or_update'
        type: choice
        options:
          - add_or_update
          - remove
      confirm_delete:
        description: 'Safety Confirmation (Must type "DELETE" if action is remove)'
        required: false
        default: ''
        type: string
      resource_type:
        description: 'Resource Type'
        required: true
        default: 'team'
        type: choice
        options:
          - team
          - folder
          - service_account
          - lbac_rule
      name:
        description: 'Name / Title (e.g. Payments, DBS Analytics, folder name, SA name)'
        required: true
        type: string
      slug:
        description: 'Identifier / Slug / UID (e.g. payments, folder-payments)'
        required: true
        type: string
      owner:
        description: 'Owner Team (for folders, service accounts, or LBAC rules)'
        required: false
        type: string
      roles:
        description: 'Fixed Roles (comma-separated, e.g. fixed:dashboards:reader, fixed:datasources:explorer)'
        required: false
        type: string
      sync_groups:
        description: 'Azure AD Group GUIDs (comma-separated, for teams)'
        required: false
        type: string
      selector:
        description: 'LogQL Selector (for Loki LBAC rules, e.g. { app="payments" })'
        required: false
        type: string

permissions:
  contents: write

jobs:
  onboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Process Resource Mutation
        env:
          ACTION: ${{ github.event.inputs.action }}
          CONFIRM_DELETE: ${{ github.event.inputs.confirm_delete }}
          TYPE: ${{ github.event.inputs.resource_type }}
          NAME: ${{ github.event.inputs.name }}
          SLUG: ${{ github.event.inputs.slug }}
          OWNER: ${{ github.event.inputs.owner }}
          ROLES: ${{ github.event.inputs.roles }}
          SYNC_GROUPS: ${{ github.event.inputs.sync_groups }}
          SELECTOR: ${{ github.event.inputs.selector }}
        run: |
          python - <<'PY'
          import os, sys, yaml

          action = os.environ.get("ACTION", "add_or_update")
          confirm_delete = os.environ.get("CONFIRM_DELETE", "")
          res_type = os.environ.get("TYPE", "")
          name = os.environ.get("NAME", "").strip()
          slug = os.environ.get("SLUG", "").strip()
          owner = os.environ.get("OWNER", "").strip()
          roles_raw = os.environ.get("ROLES", "").strip()
          sync_groups_raw = os.environ.get("SYNC_GROUPS", "").strip()
          selector = os.environ.get("SELECTOR", "").strip()

          roles = [r.strip() for r in roles_raw.split(",") if r.strip()]
          sync_groups = [s.strip() for s in sync_groups_raw.split(",") if s.strip()]

          def load_yaml(path):
              if not os.path.exists(path):
                  return {}
              with open(path, "r") as f:
                  return yaml.safe_load(f) or {}

          def save_yaml(path, data):
              with open(path, "w") as f:
                  yaml.dump(data, f, sort_keys=False, default_flow_style=False, allow_unicode=True)

          if action == "remove":
              if confirm_delete != "DELETE":
                  print("❌ Safety Check Failed: You must type 'DELETE' in confirm_delete to remove resources.", file=sys.stderr)
                  sys.exit(1)

              print(f"🗑️ Safety check passed. Removing {res_type} with slug/name: {slug} / {name}")

              if res_type == "team":
                  team_file = "chart/values/Team.yaml"
                  t_data = load_yaml(team_file)
                  t_data["teams"] = [t for t in t_data.get("teams", []) if t.get("slug") != slug and t.get("name") != name]
                  save_yaml(team_file, t_data)

                  perm_file = "chart/values/ResourcePermission.yaml"
                  p_data = load_yaml(perm_file)
                  if p_data.get("datasourcePermissions"):
                      p_data["datasourcePermissions"][0]["assignments"] = [
                          a for a in p_data["datasourcePermissions"][0].get("assignments", []) if a.get("team") != slug
                      ]
                      save_yaml(perm_file, p_data)

              elif res_type == "folder":
                  folder_file = "chart/values/GrafanaFolder.yaml"
                  f_data = load_yaml(folder_file)
                  f_data["folders"] = [f for f in f_data.get("folders", []) if f.get("uid") != slug and f.get("title") != name]
                  save_yaml(folder_file, f_data)

              elif res_type == "service_account":
                  sa_file = "chart/values/GrafanaServiceAccount.yaml"
                  s_data = load_yaml(sa_file)
                  s_data["serviceAccounts"] = [s for s in s_data.get("serviceAccounts", []) if s.get("name") != name]
                  save_yaml(sa_file, s_data)

              elif res_type == "lbac_rule":
                  lbac_file = "chart/values/TeamLBACRule.yaml"
                  l_data = load_yaml(lbac_file)
                  l_data["lbacRules"] = [r for r in l_data.get("lbacRules", []) if r.get("name") != slug and r.get("team") != slug]
                  save_yaml(lbac_file, l_data)

                  perm_file = "chart/values/ResourcePermission.yaml"
                  p_data = load_yaml(perm_file)
                  if p_data.get("datasourcePermissions"):
                      p_data["datasourcePermissions"][0]["assignments"] = [
                          a for a in p_data["datasourcePermissions"][0].get("assignments", []) if a.get("team") != slug
                      ]
                      save_yaml(perm_file, p_data)

              sys.exit(0)

          # Action: add_or_update
          if res_type == "team":
              team_file = "chart/values/Team.yaml"
              t_data = load_yaml(team_file)
              teams = [t for t in t_data.get("teams", []) if t.get("slug") != slug]
              team_entry = {
                  "name": name,
                  "slug": slug,
              }
              if owner:
                  team_entry["owner"] = owner
              if sync_groups:
                  team_entry["syncGroups"] = sync_groups
              if roles:
                  team_entry["roles"] = roles
              teams.append(team_entry)
              t_data["teams"] = teams
              save_yaml(team_file, t_data)

              if selector:
                  lbac_file = "chart/values/TeamLBACRule.yaml"
                  l_data = load_yaml(lbac_file)
                  rules = [r for r in l_data.get("lbacRules", []) if r.get("name") != slug]
                  rules.append({
                      "name": slug,
                      "team": slug,
                      "datasource": "grafanacloud-cosmicsatish-logs-lbac",
                      "selector": selector
                  })
                  l_data["lbacRules"] = rules
                  save_yaml(lbac_file, l_data)

                  perm_file = "chart/values/ResourcePermission.yaml"
                  p_data = load_yaml(perm_file)
                  if p_data.get("datasourcePermissions"):
                      assigns = [a for a in p_data["datasourcePermissions"][0].get("assignments", []) if a.get("team") != slug]
                      assigns.append({"team": slug, "permission": "Query"})
                      p_data["datasourcePermissions"][0]["assignments"] = assigns
                      save_yaml(perm_file, p_data)

          elif res_type == "folder":
              owner_team = owner if owner else "platform"
              folder_file = "chart/values/GrafanaFolder.yaml"
              f_data = load_yaml(folder_file)
              folders = [f for f in f_data.get("folders", []) if f.get("uid") != slug]
              folders.append({
                  "title": name,
                  "uid": slug,
                  "parentUid": "osttra",
                  "owner": owner_team,
                  "permissions": [
                      {"role": "Viewer", "permission": 1},
                      {"team": owner_team, "permission": 4}
                  ]
              })
              f_data["folders"] = folders
              save_yaml(folder_file, f_data)

          elif res_type == "service_account":
              sa_file = "chart/values/GrafanaServiceAccount.yaml"
              s_data = load_yaml(sa_file)
              sas = [s for s in s_data.get("serviceAccounts", []) if s.get("name") != name]
              sa_entry = {
                  "name": name,
                  "role": "None",
                  "secretName": f"{slug}-token",
                  "tokenName": f"{slug}-token",
                  "tokenExpires": "2027-12-31T23:59:59Z"
              }
              if owner:
                  sa_entry["owner"] = owner
              if roles:
                  sa_entry["fixedRoles"] = roles
              sas.append(sa_entry)
              s_data["serviceAccounts"] = sas
              save_yaml(sa_file, s_data)

          elif res_type == "lbac_rule":
              target_team = owner if owner else slug
              lbac_file = "chart/values/TeamLBACRule.yaml"
              l_data = load_yaml(lbac_file)
              rules = [r for r in l_data.get("lbacRules", []) if r.get("name") != slug]
              rules.append({
                  "name": slug,
                  "team": target_team,
                  "datasource": "grafanacloud-cosmicsatish-logs-lbac",
                  "selector": selector
              })
              l_data["lbacRules"] = rules
              save_yaml(lbac_file, l_data)

              perm_file = "chart/values/ResourcePermission.yaml"
              p_data = load_yaml(perm_file)
              if p_data.get("datasourcePermissions"):
                  assigns = [a for a in p_data["datasourcePermissions"][0].get("assignments", []) if a.get("team") != target_team]
                  assigns.append({"team": target_team, "permission": "Query"})
                  p_data["datasourcePermissions"][0]["assignments"] = assigns
                  save_yaml(perm_file, p_data)

          print(f"✅ Successfully processed {action} for {res_type} '{name}' ({slug})")
          PY

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Validate Syntax & Linting
        run: |
          helm lint chart/ -f chart/values/Team.yaml -f chart/values/GrafanaFolder.yaml -f chart/values/TeamLBACRule.yaml -f chart/values/GrafanaServiceAccount.yaml -f chart/values/ResourcePermission.yaml -f chart/values/GrafanaDatasource.yaml
          helm template grafana-admin chart/ -f chart/values/Team.yaml -f chart/values/GrafanaFolder.yaml -f chart/values/TeamLBACRule.yaml -f chart/values/GrafanaServiceAccount.yaml -f chart/values/ResourcePermission.yaml -f chart/values/GrafanaDatasource.yaml > /dev/null

      - name: Install Conftest
        run: |
          curl -sL https://github.com/open-policy-agent/conftest/releases/download/v0.59.0/conftest_0.59.0_Linux_x86_64.tar.gz | sudo tar xz -C /usr/local/bin conftest

      - name: Run Conftest Policy Guardrails
        run: conftest test chart/values/*.yaml -p policy/

      - name: Commit & Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add chart/values/
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(gitops): ${{ github.event.inputs.action }} ${{ github.event.inputs.resource_type }} '${{ github.event.inputs.name }}'"
          git push origin main
