name: GitOps Sync (Argo CD Free)

# Triggered on any push to main that touches chart files, or manually.
# Renders the Helm chart and applies manifests directly to the cluster
# via kubectl server-side apply — no Argo CD required.
#
# Required GitHub secrets: KUBECONFIG (base64-encoded kubeconfig), GRAFANA_API_KEY
# Required GitHub variables: GRAFANA_URL (e.g. https://your-stack.grafana.net)

on:
  push:
    branches: [main]
    paths:
      - 'chart/**'
      - 'deploy/operator-values.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Render & Apply to Cluster
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Ensure namespaces exist
        run: |
          kubectl create namespace grafana-operator --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace grafana-operator-configs --dry-run=client -o yaml | kubectl apply -f -

      - name: Ensure Grafana API secret exists
        run: |
          if ! kubectl -n grafana-operator-configs get secret grafanacloud-credentials >/dev/null 2>&1; then
            kubectl -n grafana-operator-configs create secret generic grafanacloud-credentials \
              --from-literal=GRAFANA_API_KEY="${{ secrets.GRAFANA_API_KEY }}"
          fi

      - name: Install / Upgrade Grafana Operator
        run: |
          helm upgrade --install grafana-operator \
            oci://ghcr.io/grafana/helm-charts/grafana-operator \
            --version 5.24.0 \
            --namespace grafana-operator \
            --create-namespace \
            --values deploy/operator-values.yaml \
            --wait --timeout 3m

      - name: Render Helm chart
        run: |
          helm template grafana-admin-platform chart/ \
            --namespace grafana-operator-configs \
            -f chart/values/Team.yaml \
            -f chart/values/GrafanaFolder.yaml \
            -f chart/values/TeamLBACRule.yaml \
            -f chart/values/GrafanaServiceAccount.yaml \
            -f chart/values/ResourcePermission.yaml \
            -f chart/values/GrafanaDatasource.yaml \
            --set grafana.url="${{ vars.GRAFANA_URL }}" \
            --set grafana.secretName="grafanacloud-credentials" \
            --set grafana.secretKey="GRAFANA_API_KEY" \
            > /tmp/rendered.yaml

      - name: Apply manifests (server-side apply)
        run: |
          kubectl apply \
            --server-side \
            --force-conflicts \
            --namespace grafana-operator-configs \
            -f /tmp/rendered.yaml

      - name: Prune removed resources
        run: |
          kubectl apply \
            --server-side \
            --force-conflicts \
            --prune \
            --namespace grafana-operator-configs \
            --selector app.kubernetes.io/instance=grafana-admin-platform \
            -f /tmp/rendered.yaml

      - name: Verify sync
        run: |
          echo "=== Grafana CRs applied in grafana-operator-configs ==="
          kubectl get grafana,grafanadatasource,grafanafolder,grafanaserviceaccount,grafanamanifest \
            -n grafana-operator-configs 2>/dev/null || true
